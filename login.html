<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ALIBI AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-left">

        <h1>ALIBI AI</h1>

        <h2>AI Interview Fraud Detection</h2>

        <p>
            Secure online interviews using Artificial Intelligence.
            Detect suspicious behaviour, eye movement,
            mobile usage and generate AI reports instantly.
        </p>

    </div>

    <div class="login-box">

        <h2>HR Login</h2>

        <form action="/dashboard">

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                placeholder="Email Address"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                placeholder="Password"
                required>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
