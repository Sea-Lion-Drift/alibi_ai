<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Interview</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="new-interview-body">

<div class="new-interview-container">

    <div class="new-header">

        <h1>Create New Interview</h1>

        <p>AI Interview Fraud Detection System</p>

    </div>

    <form action="/new_interview" method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Candidate Name *</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter candidate name"
                    required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address"
                    required>
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                    required>
            </div>

            <div class="form-group">
                <label>Job Position *</label>
                <input
                    type="text"
                    name="position"
                    placeholder="Software Engineer"
                    required>
            </div>

            <div class="form-group">

                <label>Experience Level</label>

                <select name="experience">

                    <option>Fresher</option>
                    <option>Junior</option>
                    <option>Mid-Level</option>
                    <option>Senior</option>

                </select>

            </div>

            <div class="form-group">

                <label>Department</label>

                <select name="department">

                    <option>Computer Science</option>
                    <option>Artificial Intelligence</option>
                    <option>Data Science</option>
                    <option>Cyber Security</option>
                    <option>Software Engineering</option>

                </select>

            </div>

            <div class="form-group">

                <label>Interview Type</label>

                <select name="interview_type">

                    <option>Technical</option>
                    <option>HR</option>
                    <option>Behavioral</option>
                    <option>Final Round</option>

                </select>

            </div>

            <div class="form-group">

                <label>Interview Mode</label>

                <select name="mode">

                    <option>Online</option>
                    <option>Offline</option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>Interview Notes</label>

            <textarea
                name="notes"
                rows="5"
                placeholder="Write interview instructions or notes..."></textarea>

        </div>

        <div class="auto-info">

            <div>

                <label>Interview ID</label>

                <input
                    type="text"
                    value="Generated Automatically"
                    disabled>

            </div>

            <div>

                <label>Date & Time</label>

                <input
                    type="text"
                    value="Generated Automatically"
                    disabled>

            </div>

        </div>

        <div class="button-group">

            <button
                type="button"
                class="cancel-btn"
                onclick="window.location.href='/dashboard'">

                Cancel

            </button>

            <button
                type="submit"
                class="start-btn">

                Create Interview

            </button>

        </div>

    </form>

</div>

</body>

</html>
